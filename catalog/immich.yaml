id: immich
name: Immich
category: Media
tagline: "Your own Google Photos"
description: "Back up photos and videos from your phone automatically, with search, faces, maps and albums. Includes its own database and machine-learning service."
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/immich.png
website: https://immich.app
version: "v3.3.5"
archs: [amd64, arm64]
min_ram_mb: 4096
start_timeout: 420
notes: "Needs about 4 GB of RAM. The first start downloads several images and prepares the database, which can take a few minutes. The first account you create is the admin."
screenshots:
  - https://raw.githubusercontent.com/immich-app/immich/main/design/immich-screenshots.png
web: { port: WEB_PORT }
settings:
  - key: WEB_PORT
    label: Web port
    type: port
    default: "2283"
    required: true
  - key: PHOTOS_PATH
    label: Photos folder
    type: path
    default: /srv/photos
    required: true
    description: Uploaded photos and videos are stored here. Pick a big disk.
  - key: DB_PASSWORD
    label: Database password
    type: password
    generate: true
    description: Leave empty to generate a strong one.
compose: |
  services:
    immich-server:
      image: ghcr.io/immich-app/immich-server:v3.3.5
      restart: unless-stopped
      depends_on:
        - redis
        - database
      ports:
        - "${WEB_PORT}:2283"
      volumes:
        - ${PHOTOS_PATH}:/data
        - /etc/localtime:/etc/localtime:ro
      environment:
        TZ: ${TZ}
        DB_HOSTNAME: database
        DB_USERNAME: postgres
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DATABASE_NAME: immich
        REDIS_HOSTNAME: redis
    immich-machine-learning:
      image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
      restart: unless-stopped
      volumes:
        - ${APP_DATA}/model-cache:/cache
      environment:
        TZ: ${TZ}
    redis:
      image: docker.io/valkey/valkey:9
      restart: unless-stopped
      healthcheck:
        test: redis-cli ping | grep -q PONG || exit 1
    database:
      image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
      restart: unless-stopped
      shm_size: 128mb
      volumes:
        - ${APP_DATA}/postgres:/var/lib/postgresql/data
      environment:
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_USER: postgres
        POSTGRES_DB: immich
        POSTGRES_INITDB_ARGS: --data-checksums

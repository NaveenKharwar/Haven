id: freshrss
name: FreshRSS
category: Productivity
tagline: Follow your favourite sites in one feed reader
description: A fast RSS reader that works in the browser and with mobile feed apps.
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/freshrss.png
website: https://freshrss.org
version: latest
archs: [amd64, arm64]
screenshots:
  - https://raw.githubusercontent.com/FreshRSS/FreshRSS/edge/docs/img/FreshRSS-screenshot.png
web: { port: WEB_PORT }
settings:
  - key: WEB_PORT
    label: Web port
    type: port
    default: "8088"
    required: true
compose: |
  services:
    freshrss:
      image: lscr.io/linuxserver/freshrss:latest
      restart: unless-stopped
      ports:
        - "${WEB_PORT}:80"
      volumes:
        - ${APP_DATA}/config:/config
      environment:
        PUID: ${PUID}
        PGID: ${PGID}
        TZ: ${TZ}

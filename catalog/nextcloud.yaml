id: nextcloud
name: Nextcloud
category: Files
tagline: Your own Google Drive, calendar and contacts
description: File sync and sharing with desktop and phone apps, plus calendar, contacts and office tools. Includes a database and cache.
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/nextcloud.png
website: https://nextcloud.com
version: "31"
archs: [amd64, arm64]
min_ram_mb: 1024
start_timeout: 300
screenshots:
  - https://raw.githubusercontent.com/nextcloud/screenshots/master/nextcloud-hub-25-files.png
web: { port: WEB_PORT }
notes: The first start sets up the database and can take a few minutes. Add every address you use to reach Nextcloud to Trusted addresses.
settings:
  - key: WEB_PORT
    label: Web port
    type: port
    default: "8080"
    required: true
  - key: ADMIN_USER
    label: Admin username
    type: string
    default: admin
    required: true
  - key: ADMIN_PASSWORD
    label: Admin password
    type: password
    required: true
  - key: TRUSTED_DOMAINS
    label: Trusted addresses
    type: string
    required: true
    prefill: host
    description: Server IP or hostname you will use, separated by spaces (for example 192.168.1.10 nas.local).
  - key: DB_PASSWORD
    label: Database password
    type: password
    generate: true
    description: Leave empty to generate a strong one.
compose: |
  services:
    db:
      image: mariadb:11.4
      restart: unless-stopped
      command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
      volumes:
        - ${APP_DATA}/db:/var/lib/mysql
      environment:
        MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
        MARIADB_DATABASE: nextcloud
        MARIADB_USER: nextcloud
        MARIADB_PASSWORD: ${DB_PASSWORD}
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 10s
        timeout: 5s
        retries: 12
    redis:
      image: redis:7-alpine
      restart: unless-stopped
    app:
      image: nextcloud:31-apache
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started
      ports:
        - "${WEB_PORT}:80"
      volumes:
        - ${APP_DATA}/html:/var/www/html
      environment:
        MYSQL_HOST: db
        MYSQL_DATABASE: nextcloud
        MYSQL_USER: nextcloud
        MYSQL_PASSWORD: ${DB_PASSWORD}
        REDIS_HOST: redis
        NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
        NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
        NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS}
        TZ: ${TZ}

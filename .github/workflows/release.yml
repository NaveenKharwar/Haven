name: Release

# Push a tag like v0.2.0 to publish a release. Installed copies of Haven see it
# and offer the update. The signing key must be set once as the repository
# secret HAVEN_SIGNING_KEY (see README, "Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes use the history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the signing key is set
        env:
          HAVEN_SIGNING_KEY: ${{ secrets.HAVEN_SIGNING_KEY }}
        run: |
          if [ -z "$HAVEN_SIGNING_KEY" ]; then
            echo "::error::The HAVEN_SIGNING_KEY repository secret is missing, so releases can't be signed."
            exit 1
          fi

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/haven-$VERSION
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION -X main.UpdateRepo=${{ github.repository }}" \
              -o dist/haven-linux-$arch .
          done
          cp dist/haven-linux-* install.sh uninstall.sh dist/haven-$VERSION/
          cp scripts/e2e.sh dist/haven-$VERSION/e2e.sh
          chmod +x dist/haven-$VERSION/*.sh
          tar -C dist -czf dist/haven-$VERSION.tar.gz haven-$VERSION
          # The one-line installer and the scripts it runs are published beside the binaries.
          cp install.sh uninstall.sh dist/
          sed "s#@REPO@#${{ github.repository }}#" get.sh > dist/get.sh
          chmod +x dist/get.sh

      - name: Checksums and signature
        env:
          HAVEN_SIGNING_KEY: ${{ secrets.HAVEN_SIGNING_KEY }}
        run: |
          cd dist
          sha256sum haven-linux-amd64 haven-linux-arm64 install.sh uninstall.sh > SHA256SUMS
          cd ..
          go run ./tools/sign sign dist/SHA256SUMS

      - name: Write the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Use this version's section of CHANGELOG.md when there is one...
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > dist/NOTES.md
          # ...otherwise list the commit titles since the previous release.
          if [ ! -s dist/NOTES.md ]; then
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            RANGE="${PREV:+$PREV..}$GITHUB_REF_NAME"
            git log --no-merges --pretty='- %s' $RANGE > dist/NOTES.md
          fi
          cat dist/NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/haven-linux-amd64 dist/haven-linux-arm64 \
            dist/get.sh dist/install.sh dist/uninstall.sh \
            dist/SHA256SUMS dist/SHA256SUMS.sig dist/haven-$VERSION.tar.gz \
            --title "Haven $VERSION" --notes-file dist/NOTES.md
